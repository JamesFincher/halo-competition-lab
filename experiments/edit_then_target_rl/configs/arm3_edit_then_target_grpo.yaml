# Arm 3 (V3 — FLAGSHIP): Edit-Then-Target RL
# Stage 1: Zero-gradient surgical pre-edit -> outputs/edit_then_target/stage1/checkpoint_edited
# Stage 2: Targeted Halo GRPO strictly on localized + 1-shot Fisher top-25% layers
# NOTE: weight_decay MUST be 0.0 (Halo AdamWBF16 applies decoupled wd even on zeroed grads).
model_name_or_path: outputs/edit_then_target/stage1/checkpoint_edited
dataset_name: data/policy_train.jsonl
output_dir: outputs/edit_then_target/arm3_edit_then_target_grpo

use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: ".*\\.layers\\.(14|15|16|17|18|19|20|21|22)\\.(self_attn\\.(q|k|v|o)_proj|mlp\\.(gate|up|down)_proj)$"

vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
logging_steps: 5
save_steps: 50
report_to: wandb
run_name: ett-v3-flagship-edit-then-target
