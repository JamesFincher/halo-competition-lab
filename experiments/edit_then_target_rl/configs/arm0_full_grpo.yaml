# Arm 0 (V0): Baseline Full Halo GRPO (all-layer LoRA, unmodified base model)
# Target: Qwen3-4B pilot (swap model_name_or_path to unsloth/gpt-oss-20b-BF16 for EP4/EP8 competition runs)
model_name_or_path: Qwen/Qwen3-4B
dataset_name: data/policy_train.jsonl
output_dir: outputs/edit_then_target/arm0_full_grpo

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

# Online vLLM GRPO (Halo folded NCCL weight push — 100% parity)
vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
logging_steps: 5
save_steps: 50
report_to: wandb
run_name: ett-v0-full-grpo-baseline
