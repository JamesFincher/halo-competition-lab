# Arm 2 (V2): Targeted Halo GRPO ONLY (no Stage-1 manual weight edit)
# Uses Halo's bare-YAML regex lora_target_modules (no layers_to_transform flag in Halo v1.3.0rc1).
# Replace the layer regex below with the exact output from:
#   experiments/edit_then_target_rl/scripts/localize_and_edit_weights.py
model_name_or_path: Qwen/Qwen3-4B
dataset_name: data/policy_train.jsonl
output_dir: outputs/edit_then_target/arm2_targeted_grpo_only

use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
# Bare YAML regex string (NEVER a YAML list when using regex chars — Halo script_arguments.py:120-127)
lora_target_modules: ".*\\.layers\\.(14|15|16|17|18|19|20|21|22)\\.(self_attn\\.(q|k|v|o)_proj|mlp\\.(gate|up|down)_proj)$"

vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
logging_steps: 5
save_steps: 50
report_to: wandb
run_name: ett-v2-targeted-grpo-only
