# Arm 7 (V7 — MANDATORY FALSIFICATION CONTROL per arXiv:2602.01599, ICML 2026):
# Matched-Budget Random-Layer Control
# Multiple Ticket Hypothesis proves random 1% sparse masks are surprisingly strong in RLVR.
# Our localized arms (V2/V3/V4/V5) MUST beat this random-layer control at identical parameter budget.
model_name_or_path: Qwen/Qwen3-4B
dataset_name: data/policy_train.jsonl
output_dir: outputs/edit_then_target/arm7_random_control_grpo

use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
# Non-overlapping random layers generated by localize_and_edit_weights.py (seed=42)
lora_target_modules: ".*\\.layers\\.(1|4|7|10|25|28|30|33|35)\\.(self_attn\\.(q|k|v|o)_proj|mlp\\.(gate|up|down)_proj)$"

vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
logging_steps: 5
save_steps: 50
report_to: wandb
run_name: ett-v7-random-layer-control
