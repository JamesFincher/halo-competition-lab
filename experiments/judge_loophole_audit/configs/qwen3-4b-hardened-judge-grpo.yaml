# Experiment 8: Hardened Judge GRPO (post-exposure-audit rule-masked reward)
model_name_or_path: Qwen/Qwen3-4B
dataset_name: data/policy_train.jsonl
output_dir: outputs/judge_loophole_audit/qwen3_4b_hardened_grpo

use_peft: true
lora_r: 16
lora_alpha: 32
lora_dropout: 0.0
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
report_to: wandb
run_name: exp8-hardened-judge-grpo
