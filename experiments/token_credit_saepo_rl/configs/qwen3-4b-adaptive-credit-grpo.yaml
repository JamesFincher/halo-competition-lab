# Experiment 7: Adaptive U-Stats Group Sizing (arXiv:2611.33064) + SAEPO Token Credit (arXiv:2611.29936)
# Composes cleanly with localized layer regex from Experiment 1.
model_name_or_path: Qwen/Qwen3-4B
dataset_name: data/policy_train.jsonl
output_dir: outputs/token_credit_saepo/qwen3_4b_grpo

use_peft: true
lora_r: 32
lora_alpha: 64
lora_dropout: 0.0
lora_target_modules: ".*\\.layers\\.(14|15|16|17|18|19|20|21|22)\\.(self_attn\\.(q|k|v|o)_proj|mlp\\.(gate|up|down)_proj)$"

vllm_mode: server
rollout_adapter_sync: false
num_generations: 8
max_prompt_length: 1024
max_completion_length: 1024
beta: 0.02
learning_rate: 5.0e-6
weight_decay: 0.0
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
max_steps: 200
bf16: true
seed: 42
report_to: wandb
run_name: exp7-ustats-saepo-credit-grpo
