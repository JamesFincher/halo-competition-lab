# SkyPilot single-node 8-GPU Halo launcher for Nebius Cloud (B200 or H200).
# Retarget for H200 with:
#   sky launch configs/skypilot-nebius-h200-b200.yaml \
#     --gpus H200:8 --image-id docker:public.ecr.aws/whitecircle/halo:hopper-1.3.0rc1

name: halo-competition-node

resources:
  cloud: nebius
  region: eu-north1
  accelerators: B200:8
  memory: 512+
  disk_size: 2000
  disk_tier: best
  image_id: docker:public.ecr.aws/whitecircle/halo:blackwell-1.3.0rc1

num_nodes: 1

config:
  docker:
    run_options:
      - "--ipc=host"
      - "--ulimit"
      - "memlock=-1"
      - "--ulimit"
      - "stack=67108864"
      - "--shm-size=128g"

secrets:
  HF_TOKEN: null
  WANDB_API_KEY: null
  WHITECIRCLE_API_KEY: null

envs:
  HALO_REPO_REF: "3a21b4dbdb56cb840d42a59e98e40f967a1d2807"
  CONFIG_PATH: /workspace/configs/gptoss-20b-policy-sft-ep8.yaml
  HF_HOME: /data/hf_cache
  HF_DATASETS_CACHE: /data/hf_cache/datasets
  TMPDIR: /data/tmp
  HALO_DATA_ROOT: /data/halo_scratch

file_mounts:
  /workspace: {source: ., mode: COPY}

setup: |
  set -e
  mkdir -p /data/hf_cache/datasets /data/tmp /data/halo_scratch /data/checkpoints
  python -c "import torch, flash_attn, deep_ep; print('Halo image OK:', torch.__version__)"
  if [ ! -d /opt/halo ]; then
    git clone https://github.com/whitecircle/halo.git /opt/halo
    git -C /opt/halo checkout "$HALO_REPO_REF"
  fi
  nvidia-smi --query-gpu=name,memory.total --format=csv
  if [ -n "$HF_TOKEN" ]; then hf auth login --token "$HF_TOKEN" || true; fi
  if [ -n "$WANDB_API_KEY" ]; then wandb login "$WANDB_API_KEY" || true; fi

run: |
  set -e
  cd /opt/halo
  NUM_GPUS=$(nvidia-smi -L | wc -l)
  halo launch sft "$CONFIG_PATH" -n "$NUM_GPUS"
