# Competition Track: Best gpt-oss Post-Train (SFT stage before online/environmental GRPO)
# Model: unsloth/gpt-oss-20b-BF16 (BF16 conversion required for vLLM rollout parity)
# Hardware: 1x 8-GPU node (B200/B300 or H100/H200), node-local EP=8 + native grouped expert LoRA
#
# Launch inside halo:blackwell-1.3.0rc1 (on Hopper, override --attn_implementation=eager):
#   halo launch sft configs/gptoss-20b-policy-sft-ep8.yaml -n 8

# --- Model ---
model_name_or_path: unsloth/gpt-oss-20b-BF16
attn_implementation: flash_attention_4
reset_sinks: false
chat_template: jinja-templates/gpt-oss/gpt-oss-harmony.jinja
force_chat_template: true

# --- Parallelism (single 8-GPU node, EP=8) ---
expert_parallel_size: 8
ep_scope: node
use_grouped_gemm: true

# --- LoRA (attention + native EP grouped expert LoRA) ---
use_peft: true
lora_r: 64
lora_alpha: 128
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_up_proj
  - down_proj
merge_expert_lora_on_save: true

# --- Dataset ---
dataset:
  - data/policy_train.jsonl
conversation_field: messages
test_size: 0.05

# --- Training ---
per_device_train_batch_size: 2
per_device_eval_batch_size: 2
gradient_accumulation_steps: 4
num_train_epochs: 2.0
learning_rate: 1.0e-04
lr_scheduler_type: cosine
warmup_steps: 16
gradient_checkpointing_kwargs:
  use_reentrant: false

# --- Sequence Length & Packing ---
max_length: 4096
packing: true

# --- Output & Logging ---
output_dir: /data/checkpoints/sft-gptoss-20b-policy-ep8-lora
eval_strategy: steps
eval_steps: 50
save_strategy: steps
save_steps: 100
save_total_limit: 2
save_only_model: true
logging_steps: 1
logging_first_step: true
report_to: wandb
dataloader_num_workers: 4
